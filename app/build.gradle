plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ikegami.transformerime'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ikegami.transformerime'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
