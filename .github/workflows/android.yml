name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore predictive Mozc dictionary
        id: dictionary-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/mozc_compact.db
            app/src/main/assets/mozc_compact.meta.json
          key: mozc-compact-v6-${{ hashFiles('tools/build_mozc_dictionary.py') }}

      - name: Build predictive Mozc dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_mozc_dictionary.py \
            --output app/src/main/assets/mozc_compact.db \
            --metadata app/src/main/assets/mozc_compact.meta.json \
            --max-candidates 12

      - name: Verify Mozc exact and prefix predictions
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path = Path('app/src/main/assets/mozc_compact.db')
          meta = Path('app/src/main/assets/mozc_compact.meta.json')
          assert path.exists() and path.stat().st_size > 1_000_000
          info = json.loads(meta.read_text(encoding='utf-8'))
          assert info['format_version'] == '2', info
          assert int(info['unique_readings']) > 100_000, info
          assert int(info['prediction_entry_count']) > 10_000, info
          db = sqlite3.connect(path)
          exact = [r[0] for r in db.execute(
              "SELECT surface FROM entries WHERE reading=? ORDER BY cost", ('うめだ',)
          )]
          predicted = [r[0] for r in db.execute(
              "SELECT surface FROM predictions WHERE prefix=? ORDER BY cost", ('うめ',)
          )]
          assert '梅田' in exact, exact
          assert '梅田' in predicted, predicted
          print('Mozc verified: うめだ ->', exact[:6], '/ うめ ->', predicted[:8])
          db.close()
          PY

      - name: Restore Japanese context predictions
        id: context-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/context_predictions.db
            app/src/main/assets/context_predictions.meta.json
          key: context-pred-v6-${{ hashFiles('tools/build_context_predictions.py') }}

      - name: Install context tokenizer
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install fugashi unidic-lite

      - name: Build Japanese context predictions
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_context_predictions.py \
            --output app/src/main/assets/context_predictions.db \
            --metadata app/src/main/assets/context_predictions.meta.json \
            --max-sentences 60000 \
            --max-candidates 10 \
            --min-frequency 2

      - name: Verify context prediction DB
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path = Path('app/src/main/assets/context_predictions.db')
          info = json.loads(Path('app/src/main/assets/context_predictions.meta.json').read_text(encoding='utf-8'))
          assert path.exists() and path.stat().st_size > 100_000, path.stat().st_size
          assert int(info['unique_contexts']) > 1000, info
          assert int(info['prediction_entries']) > 5000, info
          db = sqlite3.connect(path)
          examples = list(db.execute(
              "SELECT context,continuation,freq FROM predictions ORDER BY freq DESC LIMIT 8"
          ))
          assert examples
          print('Context DB verified:', info['unique_contexts'], 'contexts, examples=', examples)
          db.close()
          PY

      - name: Restore trained Japanese model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/medium_moe_jpn.q8
            app/src/main/assets/medium_moe_jpn.meta.json
          key: jp-medium-moe-v3-${{ hashFiles('tools/train_medium_moe_japanese.py') }}

      - name: Install CPU PyTorch
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train 5M Japanese MoE
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python tools/train_medium_moe_japanese.py \
            --output app/src/main/assets/medium_moe_jpn.q8 \
            --metadata app/src/main/assets/medium_moe_jpn.meta.json \
            --steps 1800 \
            --max-sentences 80000 \
            --batch-size 24

      - name: Verify Japanese model asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          model = Path('app/src/main/assets/medium_moe_jpn.q8')
          meta = Path('app/src/main/assets/medium_moe_jpn.meta.json')
          assert model.exists() and model.stat().st_size > 5_000_000
          assert model.read_bytes()[:4] == b'MMJQ'
          info = json.loads(meta.read_text(encoding='utf-8'))
          assert info['parameter_count'] >= 5_000_000
          assert info['training']['corpus'].startswith('Tatoeba')
          print('Japanese model verified:', info['parameter_count'], 'params,', model.stat().st_size, 'bytes')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.6.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v0.6 metadata
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.6.0-metadata
          path: |
            app/src/main/assets/medium_moe_jpn.meta.json
            app/src/main/assets/mozc_compact.meta.json
            app/src/main/assets/context_predictions.meta.json
