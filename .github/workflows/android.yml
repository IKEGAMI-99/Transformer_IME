name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore predictive Mozc dictionary
        id: dictionary-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/mozc_compact.db
            app/src/main/assets/mozc_compact.meta.json
          key: mozc-compact-v6-${{ hashFiles('tools/build_mozc_dictionary.py') }}

      - name: Build predictive Mozc dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_mozc_dictionary.py \
            --output app/src/main/assets/mozc_compact.db \
            --metadata app/src/main/assets/mozc_compact.meta.json \
            --max-candidates 12

      - name: Verify Mozc exact and prefix predictions
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path = Path('app/src/main/assets/mozc_compact.db')
          info = json.loads(Path('app/src/main/assets/mozc_compact.meta.json').read_text(encoding='utf-8'))
          assert path.exists() and path.stat().st_size > 1_000_000
          assert info['format_version'] == '2', info
          assert int(info['unique_readings']) > 100_000, info
          db = sqlite3.connect(path)
          exact = [r[0] for r in db.execute("SELECT surface FROM entries WHERE reading=? ORDER BY cost", ('うめだ',))]
          predicted = [r[0] for r in db.execute("SELECT surface FROM predictions WHERE prefix=? ORDER BY cost", ('うめ',))]
          assert '梅田' in exact, exact
          assert '梅田' in predicted, predicted
          print('Mozc verified:', exact[:6], '/', predicted[:8])
          db.close()
          PY

      - name: Restore Japanese context predictions
        id: context-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/context_predictions.db
            app/src/main/assets/context_predictions.meta.json
          key: context-pred-v6-${{ hashFiles('tools/build_context_predictions.py') }}

      - name: Install context tokenizer
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install fugashi unidic-lite

      - name: Build Japanese context predictions
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_context_predictions.py \
            --output app/src/main/assets/context_predictions.db \
            --metadata app/src/main/assets/context_predictions.meta.json \
            --max-sentences 60000 \
            --max-candidates 10 \
            --min-frequency 2

      - name: Verify context prediction DB
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path = Path('app/src/main/assets/context_predictions.db')
          info = json.loads(Path('app/src/main/assets/context_predictions.meta.json').read_text(encoding='utf-8'))
          assert path.exists() and path.stat().st_size > 100_000
          assert int(info['unique_contexts']) > 1000, info
          assert int(info['prediction_entries']) > 5000, info
          print('Context DB verified:', info['unique_contexts'], 'contexts')
          PY

      - name: Restore Zenzai Q5 models
        id: zenz-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf
            app/src/main/assets/zenz-v3.1-small-Q5_K_M.gguf
            app/src/main/assets/zenzai190.meta.json
          key: zenzai-190m-v32-v31-q5km-1

      - name: Download Zenzai 190M cascade
        if: steps.zenz-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf?download=true' \
            -o app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/Miwa-Keita/zenz-v3.1-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf?download=true' \
            -o app/src/main/assets/zenz-v3.1-small-Q5_K_M.gguf

      - name: Verify Zenzai model files and write metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          models = [
              ('primary', Path('app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf'), '95.1M', 'Apache-2.0'),
              ('fallback', Path('app/src/main/assets/zenz-v3.1-small-Q5_K_M.gguf'), '95.1M', 'CC BY-SA 4.0'),
          ]
          result = {
              'version': '0.8.1',
              'design': 'Zenzai top-branch 3-way conversion + multi-reading next prediction',
              'estimated_total_parameters': 190_200_000,
              'quantization': 'Q5_K_M',
              'models': []
          }
          for role, path, params, license_name in models:
              data_head = path.read_bytes()[:4]
              assert data_head == b'GGUF', (path, data_head)
              assert path.stat().st_size > 65_000_000, path.stat().st_size
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              result['models'].append({
                  'role': role, 'file': path.name, 'parameters': params,
                  'license': license_name, 'file_size': path.stat().st_size, 'sha256': digest
              })
          Path('app/src/main/assets/zenzai190.meta.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Clone azooKey llama.cpp b4846
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch b4846 https://github.com/azooKey/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build host llama-cli for model smoke test
        run: |
          cmake -S app/src/main/cpp/llama.cpp -B .cache/llama-host \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build .cache/llama-host --config Release -j2 --target llama-cli

      - name: Smoke-test Zenzai direct conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          # Zenzai v3: context tag + Katakana reading + output tag.
          Path('/tmp/zenz_prompt.txt').write_text('\uee02東京へ行く。\uee00シンジュクエキ\uee01', encoding='utf-8')
          PY
          set +e
          timeout 60 .cache/llama-host/bin/llama-cli \
            -m app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf \
            --file /tmp/zenz_prompt.txt --predict 20 --temp 0 > /tmp/zenz_out.txt 2>&1
          status=$?
          set -e
          cat /tmp/zenz_out.txt
          test "$status" -eq 0
          grep -q '新宿' /tmp/zenz_out.txt

      - name: Verify v0.8.1 multi-candidate sources
        run: |
          grep -q 'nativeGenerateCandidates' app/src/main/cpp/zenz_jni.cpp
          grep -q 'AI_CONVERSION_COUNT = 3' app/src/main/java/com/ikegami/transformerime/model/Zenzai190MEngine.kt
          grep -q 'NEXT_PRIMARY_BRANCHES = 4' app/src/main/java/com/ikegami/transformerime/model/Zenzai190MEngine.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains dual GGUF and native runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.exists() and apk.stat().st_size > 120_000_000, apk.stat().st_size
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'assets/zenz-v3.2-small-Q5_K_M.gguf' in names
              assert 'assets/zenz-v3.1-small-Q5_K_M.gguf' in names
              assert any(n.endswith('/libzenzjni.so') for n in names), [n for n in names if 'zenz' in n]
          print('APK verified:', apk.stat().st_size, 'bytes')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.8.1-Zenzai190M-MultiAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v0.8.1 metadata
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.8.1-metadata
          path: |
            app/src/main/assets/zenzai190.meta.json
            app/src/main/assets/mozc_compact.meta.json
            app/src/main/assets/context_predictions.meta.json
            THIRD_PARTY_MODELS.md
