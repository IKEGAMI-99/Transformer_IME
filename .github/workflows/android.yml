name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore predictive Mozc dictionary
        id: dictionary-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/mozc_compact.db
            app/src/main/assets/mozc_compact.meta.json
          key: mozc-compact-v6-${{ hashFiles('tools/build_mozc_dictionary.py') }}

      - name: Build predictive Mozc dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_mozc_dictionary.py \
            --output app/src/main/assets/mozc_compact.db \
            --metadata app/src/main/assets/mozc_compact.meta.json \
            --max-candidates 12

      - name: Verify Mozc exact and prefix predictions
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          path = Path('app/src/main/assets/mozc_compact.db')
          info = json.loads(Path('app/src/main/assets/mozc_compact.meta.json').read_text(encoding='utf-8'))
          assert path.exists() and path.stat().st_size > 1_000_000
          assert info['format_version'] == '2', info
          assert int(info['unique_readings']) > 100_000, info
          db = sqlite3.connect(path)
          exact = [r[0] for r in db.execute("SELECT surface FROM entries WHERE reading=? ORDER BY cost", ('うめだ',))]
          predicted = [r[0] for r in db.execute("SELECT surface FROM predictions WHERE prefix=? ORDER BY cost", ('うめ',))]
          assert '梅田' in exact, exact
          assert '梅田' in predicted, predicted
          db.close()
          PY

      - name: Restore Japanese context predictions
        id: context-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/context_predictions.db
            app/src/main/assets/context_predictions.meta.json
          key: context-pred-v6-${{ hashFiles('tools/build_context_predictions.py') }}

      - name: Install context tokenizer
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install fugashi unidic-lite

      - name: Build Japanese context predictions
        if: steps.context-cache.outputs.cache-hit != 'true'
        run: |
          python tools/build_context_predictions.py \
            --output app/src/main/assets/context_predictions.db \
            --metadata app/src/main/assets/context_predictions.meta.json \
            --max-sentences 60000 \
            --max-candidates 10 \
            --min-frequency 2

      - name: Verify context prediction DB
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('app/src/main/assets/context_predictions.meta.json').read_text(encoding='utf-8'))
          assert int(info['unique_contexts']) > 1000, info
          assert int(info['prediction_entries']) > 5000, info
          PY

      - name: Restore Zenzai v3.2 Q5 model
        id: zenz-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf
            app/src/main/assets/zenzai95.meta.json
          key: zenzai-95m-v32-q5km-1

      - name: Download Zenzai 95M model
        if: steps.zenz-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf?download=true' \
            -o app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf

      - name: Verify Zenzai model and write metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          path = Path('app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf')
          assert path.read_bytes()[:4] == b'GGUF'
          assert path.stat().st_size > 65_000_000
          result = {
              'version': '0.11.0',
              'design': 'Zenzai 10-way expansion plus constrained conditional-likelihood scoring over up to 20 Mozc/RAG/neural candidates; personalized prior fusion; Unicode-safe JNI; stable equal-height QWERTY/flick layout',
              'estimated_total_parameters': 95_100_000,
              'quantization': 'Q5_K_M',
              'inference_trials': 10,
              'scored_candidates': 20,
              'model': {
                  'file': path.name,
                  'parameters': '95.1M',
                  'license': 'Apache-2.0',
                  'file_size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          }
          Path('app/src/main/assets/zenzai95.meta.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Clone azooKey llama.cpp b4846
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch b4846 https://github.com/azooKey/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build host llama-cli for model smoke test
        run: |
          cmake -S app/src/main/cpp/llama.cpp -B .cache/llama-host \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build .cache/llama-host --config Release -j2 --target llama-cli

      - name: Smoke-test Zenzai direct conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/zenz_prompt.txt').write_text('\uee02東京へ行く。\uee00シンジュクエキ\uee01', encoding='utf-8')
          PY
          set +e
          timeout 60 .cache/llama-host/bin/llama-cli \
            -m app/src/main/assets/zenz-v3.2-small-Q5_K_M.gguf \
            --file /tmp/zenz_prompt.txt --predict 20 --temp 0 > /tmp/zenz_out.txt 2>&1
          status=$?
          set -e
          cat /tmp/zenz_out.txt
          test "$status" -eq 0
          grep -q '新宿' /tmp/zenz_out.txt

      - name: Verify v0.11 precision, UI, stability and Unicode architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          ime = Path('app/src/main/java/com/ikegami/transformerime/ime/TransformerImeService.kt').read_text(encoding='utf-8')
          engine = Path('app/src/main/java/com/ikegami/transformerime/model/Zenzai190MEngine.kt').read_text(encoding='utf-8')
          medium = Path('app/src/main/java/com/ikegami/transformerime/model/MediumMoETransformer.kt').read_text(encoding='utf-8')
          pulse = Path('app/src/main/java/com/ikegami/transformerime/audio/AudioPulseService.kt').read_text(encoding='utf-8')
          flick = Path('app/src/main/java/com/ikegami/transformerime/ime/FlickKana.kt').read_text(encoding='utf-8')
          state = Path('app/src/main/java/com/ikegami/transformerime/audio/AudioPulseState.kt').read_text(encoding='utf-8')
          jni = Path('app/src/main/cpp/zenz_jni.cpp').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')

          assert "versionName '0.11.0'" in gradle
          assert 'INFERENCE_TRIALS = 10' in engine
          assert 'MAX_SCORED_CANDIDATES = 20' in engine

          # v0.11 constrained reranker: free generation broadens the pool, but Zenzai then scores
          # the actual Mozc/RAG surface candidates by conditional log-likelihood.
          assert 'nativeScoreCandidates' in engine
          assert 'fuseConditionalScores' in engine
          assert 'MAX_DRAFTS_FOR_SCORING = 16' in engine
          assert 'MAX_NOVEL_NEURAL = 4' in engine
          assert 'candidate_log_probability' in jni
          assert 'target_log_probability' in jni
          assert 'score_candidate_set' in jni
          assert 'Java_com_ikegami_transformerime_model_ZenzaiNative_nativeScoreCandidates' in jni
          assert 'std::pow(static_cast<double>(scored_tokens), 0.65)' in jni

          # Bottom corner keys no longer get special pill/accent backgrounds.
          assert 'functionButton("あa1", pill = true)' not in ime
          assert 'functionButton("↵", accent = true)' not in ime
          assert 'qwertyButton("↵", 1.2f, accent = true)' not in ime
          assert 'numberPadButton(label, accent = true)' not in ime
          assert 'functionButton("あa1") { toggleMode(false) }' in ime
          assert 'functionButton("↵") { handleEnter() }' in ime

          # QWERTY/Japanese geometry and deterministic Katakana escape remain stable.
          assert 'private fun japaneseRowParams() = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 60.dp())' in ime
          assert 'private fun qwertyRowParams() = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 60.dp())' in ime
          assert 'container.paddingBottom != safeBottom' in ime
          toggle = ime.split('private fun toggleMode', 1)[1].split('private fun cancelPendingRerank', 1)[0]
          assert 'requestApplyInsets' not in toggle
          assert 'keyboardContainer?.requestLayout()' in toggle
          assert 'private fun forceKatakanaSecond' in ime

          # Unicode-safe JNI crash regression remains permanent.
          assert 'jstring utf8_to_jstring' in jni
          assert 'std::string jstring_to_utf8' in jni
          assert 'env->NewString(' in jni
          assert 'i + need > text.size()' in jni
          assert 'dropped_tail = true' in jni
          assert '0xD800' in jni and '0xDC00' in jni
          assert 'env->NewStringUTF' not in jni
          assert 'env->GetStringUTFChars' not in jni
          crash_tail = bytes.fromhex('e3 82 a2 e3 82 a4 e3 83 8e ee b8')
          try:
              crash_tail.decode('utf-8', errors='strict')
              raise AssertionError('fixture unexpectedly became valid UTF-8')
          except UnicodeDecodeError as exc:
              assert exc.start == len(crash_tail) - 2

          # InputView reuse and serialized native runtime stay intact.
          assert 'override fun onStartInputView' in ime
          finish = ime.split('override fun onFinishInputView', 1)[1].split('private fun resumeInputView', 1)[0]
          for forbidden in ('candidateRow = null', 'keyboardContainer = null', 'pulseBackground = null', 'commentOverlay = null'):
              assert forbidden not in finish, forbidden
          assert 'private val nativeInferenceLock = Any()' in medium
          assert 'synchronized(nativeInferenceLock)' in medium
          assert 'fun close() = Unit' in medium
          assert 'compositionBuffer.toString() != reading' in ime
          assert 'epoch != candidateEpoch' in ime
          assert 'epoch != predictionEpoch' in ime

          # Audio Pulse and existing UX remain intact.
          assert 'START_NOT_STICKY' in pulse
          assert 'AudioRecord.ERROR_DEAD_OBJECT' in pulse
          assert 'AudioPulseState.publish(envelope)' in pulse
          assert '@Volatile var level' in state
          assert 'functionButton("空白")' in ime
          assert 'private fun kanaModifierFlickButton' in ime
          assert 'ModifierAction.DAKUTEN' in ime and 'ModifierAction.HANDAKUTEN' in ime
          assert 'fun applyDakuten' in flick and 'fun applyHandakuten' in flick
          assert 'text = "$candidate wwww"' in ime

          assert not Path('app/src/main/assets/zenz-v3.1-small-Q5_K_M.gguf').exists()
          print('v0.11 precision/UI/JNI source checks passed')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains single GGUF and native runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.exists() and apk.stat().st_size > 70_000_000, apk.stat().st_size
          assert apk.stat().st_size < 140_000_000, apk.stat().st_size
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'assets/zenz-v3.2-small-Q5_K_M.gguf' in names
              assert 'assets/zenz-v3.1-small-Q5_K_M.gguf' not in names
              assert any(n.endswith('/libzenzjni.so') for n in names)
          print('APK verified:', apk.stat().st_size, 'bytes')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.11.0-PrecisionReranker-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v0.11.0 metadata
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-IME-v0.11.0-metadata
          path: |
            app/src/main/assets/zenzai95.meta.json
            app/src/main/assets/mozc_compact.meta.json
            app/src/main/assets/context_predictions.meta.json
            THIRD_PARTY_MODELS.md
