name: Apply v0.11 UI patch

on:
  push:
    branches: [ feature/v0.11-precision-reranker ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.11-precision-reranker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted UI replacements
        run: python tools/apply_v011_ui_patch.py
      - name: Commit patched service
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ikegami/transformerime/ime/TransformerImeService.kt
          git commit -m 'ui: flatten bottom mode and enter keys'
          git push origin HEAD:feature/v0.11-precision-reranker
